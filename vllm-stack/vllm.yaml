apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vllm
  name: vllm
  namespace: vllm-rocm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
      - image: vllm/vllm-openai-rocm:latest
        name: vllm-openai-rocm
        resources:
          limits:
            amd.com/gpu: 1
        volumeMounts:
          - name: model-storage
            mountPath: /root/.cache/huggingface
        args:
          - "--model"
          - "ornith-ai/Ornith-1.5-9B"
          - "--max-model-len"
          - "65536"
          - "--max-num-seqs"
          - "32"
          - "--kv-cache-dtype"
          - "fp8"
          - "--reasoning-parser"
          - "qwen3"
          - "--enable-auto-tool-choice"
          - "--tool-call-parser"
          - "qwen3_coder"
        ports:
          - containerPort: 8000
      volumes:
      - name: model-storage
        hostPath:
          path: /root/vllm/huggingface
          type: DirectoryOrCreate
      enableServiceLinks: false

status: {}
