apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.data.name }}
  labels:
    {{- include "knowledge.labels" (dict "app" "knowledge" "root" $) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  capacity:
    storage: {{ .Values.data.size }}
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: {{ .Values.data.hostPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [{{ .Values.data.node }}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.data.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "knowledge.labels" (dict "app" "knowledge" "root" $) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  volumeName: {{ .Values.data.name }}
  resources:
    requests:
      storage: {{ .Values.data.size }}
