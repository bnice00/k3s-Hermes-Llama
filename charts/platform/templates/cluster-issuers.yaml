{{- if .Values.certIssuers.enabled }}
{{- $servers := dict "cf-prod" "https://acme-v02.api.letsencrypt.org/directory" "cf-staging" "https://acme-staging-v02.api.letsencrypt.org/directory" }}
{{- range $name, $server := $servers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" $ | nindent 4 }}
spec:
  acme:
    email: {{ $.Values.certIssuers.email }}
    server: {{ $server }}
    privateKeySecretRef:
      name: {{ $.Values.certIssuers.accountKeySecret }}
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ $.Values.certIssuers.cloudflareSecret }}
              key: {{ $.Values.certIssuers.cloudflareKey }}
        selector:
          dnsZones:
            - {{ $.Values.certIssuers.domain | quote }}
{{- end }}
{{- end }}
