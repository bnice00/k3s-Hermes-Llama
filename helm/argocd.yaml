global:
  domain: argocd.a1abeachbum.com
  nodeSelector:
    kubernetes.io/hostname: beachbumhq

configs:
  params:
    server.insecure: true
  ssh:
    extraHosts: |
      forgejo-ssh.forgejo.svc.cluster.local ssh-rsa 
server:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: cf-prod
    tls: true

dex:
  enabled: false                   # no SSO
notifications:
  enabled: false
