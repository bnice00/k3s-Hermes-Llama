apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: deb-slim
  namespace: hermes-lair
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: deb-slim
  serviceName: deb-slim
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-11-13T14:41:54-05:00'
      labels:
        app: deb-slim
    spec:
      containers:
        - env:
            - name: TZ
              value: America/New_York
          image: a1abeachbum/deb-slim-ssh@sha256:cda793015aa58ed37af5a01c5b0c726197f7c2b34bee36a0c143b80b7dfefad0
          imagePullPolicy: IfNotPresent
          name: deb-slim
          ports:
            - containerPort: 22
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /home/hermes-agent/vault
              name: hermes-data
              subPath: vaults
            - mountPath: /home/hermes-agent/data
              name: hermes-data
              subPath: data
            - mountPath: /etc/hermes-forgejo
              name: forgejo-creds
              readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: forgejo-creds
          secret:
            defaultMode: 256
            secretName: hermes-forgejo
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
