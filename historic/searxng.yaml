apiVersion: v1
kind: Namespace
metadata:
  name: sear-search
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: sear-search
data:
  settings.yml: |
    use_default_settings: true
    server:
      limiter: false
      public_instance: false
      image_proxy: false
    search:
      formats:
        - html
        - json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: searxng
  name: searxng
  namespace: sear-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
      - image: searxng/searxng:latest      # swap for @sha256:... pin
        name: searxng
        ports:
        - containerPort: 8080
        env:
        - name: SEARXNG_SECRET
          valueFrom:
            secretKeyRef:
              name: searxng-secret
              key: SEARXNG_SECRET
        volumeMounts:
        - name: settings
          mountPath: /etc/searxng/settings.yml
          subPath: settings.yml
      volumes:
      - name: settings
        configMap:
          name: searxng-settings
---
apiVersion: v1
kind: Service
metadata:
  name: sear-serve
  namespace: sear-search
  labels:
    app: searxng
spec:
  type: ClusterIP
  selector:
    app: searxng
  ports:
    - name: 8181-8181
      port: 8181
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sear-ingress
  namespace: sear-search
  annotations:
    cert-manager.io/cluster-issuer: cf-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - searxng.<your_domain>.com
      secretName: sear-tls
  rules:
    - host: searxng.<your_domain>.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sear-serve
                port:
                  number: 8181
