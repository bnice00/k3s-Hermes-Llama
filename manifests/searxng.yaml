apiVersion: v1
kind: Namespace
metadata:
  name: sear-search
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: sear-search
  labels:
    app: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
        - name: searxng
          image: searxng/searxng:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sear-serve
  namespace: sear-search
  labels:
    app: searxng
spec:
  type: ClusterIP
  selector:
    app: searxng
  ports:
    - name: 8181-8181
      port: 8181
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sear-ingress
  namespace: sear-search
  annotations:
    cert-manager.io/cluster-issuer: cf-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - searxng.<your_domain>.com
      secretName: sear-tls
  rules:
    - host: searxng.<your_domain>.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sear-serve
                port:
                  number: 8181
