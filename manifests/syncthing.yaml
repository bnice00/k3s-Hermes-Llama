apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: syncthing
  name: syncthing
  namespace: knowledge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: syncthing
  strategy:
    type: Recreate          
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      hostname: knowledge-hub                     
      containers:
      - image: lscr.io/linuxserver/syncthing:latest
        name: syncthing
        env:                                      
        - name: PUID
          value: "1000"                           
        - name: PGID
          value: "1000"
        - name: TZ
          value: America/New_York
        ports:                                    
        - name: gui
          containerPort: 8384
          protocol: TCP
        - name: sync-tcp
          containerPort: 22000
          protocol: TCP
        - name: sync-udp
          containerPort: 22000
          protocol: UDP
        volumeMounts:                             
        - name: knowledge
          mountPath: /config
          subPath: config               
        - name: knowledge
          mountPath: /data1
          subPath: vault                          
      volumes:
      - name: knowledge
        persistentVolumeClaim:
          claimName: knowledge-data
---
apiVersion: v1
kind: Service
metadata:
  name: syncthing
  namespace: knowledge
spec:
  type: NodePort
  selector:
    app: syncthing                      
  ports:                                          
  - name: gui
    port: 8384
    targetPort: gui
    nodePort: 32384
  - name: sync-tcp
    port: 22000
    targetPort: sync-tcp
    protocol: TCP
    nodePort: 32200
  - name: sync-udp
    port: 22000
    targetPort: sync-udp
    protocol: UDP
    nodePort: 32200

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: knowledge-data
spec:
  capacity:
    storage: 25Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /home/brock/knowledge/logseq
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - beachbumhq   

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledge-data
  namespace: knowledge
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  volumeName: knowledge-data
  resources:
    requests:
      storage: 25Gi
